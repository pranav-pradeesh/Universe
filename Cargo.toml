[package]
name = "reality-engine"
version = "0.1.0"
edition = "2021"
description = "A deterministic emergent reality substrate"
license = "MIT"

[[bin]]
name = "reality-engine"
path = "src/main.rs"

[dependencies]
rustc-hash = "1.1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
